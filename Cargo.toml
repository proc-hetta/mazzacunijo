[package]
name = "mazzacunijo"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
envy = "0.4.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_with = { version = "3.24.0", features = ["json"] }
teloxide = { version = "0.17.0", features = ["ctrlc_handler", "macros", "rustls"], default-features = false }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
wol-rs = "1.1.0"

[profile.release]
strip = true
